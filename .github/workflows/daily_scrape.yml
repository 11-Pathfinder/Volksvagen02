name: Daily VW Used Cars Scrape

on:
  # Run every day at 7:00 AM UTC (covers 7:00 AM GMT in winter)
  schedule:
    - cron: "0 7 * * *"

  # Allow manual triggering from the Actions tab
  workflow_dispatch:

  # Also run on push to this branch so the workflow registers immediately
  push:
    branches:
      - claude/vw-cars-scraper-qmsbl

jobs:
  scrape-and-email:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/python:v1.50.0-noble

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper and send email
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          EMAIL_RECIPIENT: "mohit.sanwal@gmail.com"
        run: python main.py

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_number }}
          path: |
            listings.json
            debug_page.html
            debug_screenshot.png
          if-no-files-found: ignore
          retention-days: 30
