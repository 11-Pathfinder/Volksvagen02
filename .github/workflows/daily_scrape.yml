name: Daily VW Used Cars Scrape

on:
  # Run every day at 7:00 AM UK time (GMT/BST)
  # 7:00 AM GMT = 07:00 UTC (winter)
  # 7:00 AM BST = 06:00 UTC (summer)
  # Using 07:00 UTC to cover GMT; adjust to 06:00 for BST if needed
  schedule:
    - cron: "0 7 * * *"

  # Allow manual triggering for testing
  workflow_dispatch:

jobs:
  scrape-and-email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Run scraper and send email
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          EMAIL_RECIPIENT: "mohit.sanwal@gmail.com"
        run: python main.py

      - name: Upload listings artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: listings-${{ github.run_number }}
          path: |
            listings.json
            debug_page.html
          retention-days: 30
